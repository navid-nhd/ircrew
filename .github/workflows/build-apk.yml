name: Build IRCrew Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}  # manual trigger from the Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Capacitor + the web app live under client/. The Express proxy in
        # server/ is not bundled into the APK — it's expected to run on a host
        # the app can reach via the configurable apiBase URL.
        working-directory: client
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app (Vite)
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK at: $APK"
          ls -la "$APK"
        working-directory: client/android

      - name: Upload Debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ircrew-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        working-directory: client/android
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload Release APK if available
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ircrew-release-unsigned-apk
          path: client/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
